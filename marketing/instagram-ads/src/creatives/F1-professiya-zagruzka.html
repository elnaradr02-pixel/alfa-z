<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>F1 · Профессия: загрузка</title>
<link rel="stylesheet" href="../base.css">
<style>
  .frame { background: var(--night); color: var(--paper); }
  .bg { background: radial-gradient(760px 560px at 85% 8%, rgba(var(--accent-rgb),.42), transparent 62%), radial-gradient(760px 640px at 0% 100%, rgba(var(--accent-d-rgb),.34), transparent 62%), radial-gradient(820px 620px at 50% 50%, rgba(var(--accent-rgb),.16), transparent 70%), var(--night); }
  .bg::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(var(--paper-rgb),.10) 2.2px, transparent 2.6px); background-size: 34px 34px; }
  .h1 { color: var(--paper); }
  .ui { margin-top: 44px; border-radius: 40px; background: var(--night-2); border: 3px solid rgba(var(--paper-rgb),.14); box-shadow: 0 40px 90px -40px color-mix(in srgb, var(--night) 35%, #000), 0 0 0 1px rgba(var(--accent-2-rgb),.10); overflow: hidden; }
  .ui .top { display: flex; align-items: center; gap: 12px; padding: 22px 30px; background: rgba(var(--paper-rgb),.06); font: 400 25px "JetBrains Mono","Space Mono",monospace; color: rgba(var(--paper-rgb),.62); }
  .ui .top i { width: 15px; height: 15px; border-radius: 50%; display: block; } .ui .top i:nth-child(1){background:var(--accent)}.ui .top i:nth-child(2){background:var(--accent-2)}.ui .top i:nth-child(3){background:var(--hi)}
  .ui .top span { margin-left: 10px; }
  .ui .body { padding: 34px 38px 40px; }
  .ui .st { font: 700 44px/1.15 "Manrope"; letter-spacing: -0.02em; }
  .ui .st em { font-style: normal; color: color-mix(in srgb, var(--accent) 70%, #fff); font-family: "JetBrains Mono","Space Mono",monospace; }
  .bar { position: relative; margin: 26px 0 14px; height: 54px; border-radius: 27px; background: rgba(var(--paper-rgb),.1); overflow: hidden; }
  .bar b { position: absolute; left: 0; top: 0; bottom: 0; width: 12%; border-radius: 27px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 0 40px rgba(var(--accent-rgb),.7); }
  .bar b::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 60px; background: linear-gradient(90deg, transparent, rgba(var(--paper-rgb),.6)); border-radius: 27px; }
  .pct { display: flex; justify-content: space-between; font: 400 26px "JetBrains Mono","Space Mono",monospace; color: rgba(var(--paper-rgb),.55); }
  .pct .warn { color: var(--hi); }
  .boost { position: relative; margin-top: 30px; }
  .boost .btn { display: flex; align-items: center; justify-content: center; gap: 16px; height: 108px; border-radius: 28px; background: var(--accent); color: var(--on-accent); font: 800 42px "Manrope"; box-shadow: 0 0 0 8px rgba(var(--accent-rgb),.26), 0 24px 50px -16px rgba(var(--accent-rgb),.9), inset 0 -6px 0 rgba(var(--night-rgb),.16); }
  .boost .btn small { font: 700 32px "Manrope"; opacity: .92; }
  .boost::before { content: ""; position: absolute; right: 70px; top: 4px; width: 72px; height: 72px; border-radius: 50%; border: 3px solid rgba(var(--paper-rgb),.6); background: radial-gradient(circle, rgba(var(--paper-rgb),.28), rgba(var(--paper-rgb),0) 70%); }
  .finger { position: absolute; right: 26px; bottom: -36px; font-size: 100px; transform: rotate(-12deg); filter: drop-shadow(0 10px 14px rgba(var(--night-rgb),.7)); }
  .sub { margin-top: 62px; color: var(--paper); opacity: .85; }
  body.story .ui { margin-top: 80px; } body.story .sub { margin-top: 90px; }
</style></head>
<body class="on-dark theme-indigo"><div class="frame"><div class="bg"></div>
<div class="content">
  <div class="logo"><div class="mark">αZ</div><div class="name"><b>α</b>lfa Z<small>школа программирования · 12–17 лет</small></div></div>
  <h1 class="h1 xl" style="margin-top:40px;font-size:108px">Кем станет <span class="mark-y">ваш ребёнок?</span></h1>

  <div class="ui">
    <div class="top"><i></i><i></i><i></i><span>profession.exe</span></div>
    <div class="body">
      <div class="st">Профессия: <em>загрузка…</em></div>
      <div class="bar"><b></b></div>
      <div class="pct"><span>12%</span><span class="warn">не выбрана</span></div>
      <div class="boost"><div class="btn">Ускорить <small>· пробный урок 3000 ₸</small></div><div class="finger">👆</div></div>
    </div>
  </div>

  <p class="sub">За 60 минут вы вместе поймёте, <b>зажигает ли его IT</b>.</p>
  <div class="grow"></div>
  <div class="why"><span class="k">Почему сейчас</span><span class="t">Выбирать профессию скоро — начните сейчас</span></div>
  <div class="cta">Записаться на пробный урок <span class="arr">→</span></div>
</div></div>
<script src="../fmt.js"></script></body></html>
