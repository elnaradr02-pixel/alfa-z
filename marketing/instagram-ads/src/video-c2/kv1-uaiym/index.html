<!-- Кампания 2 · видео KV1 «Уайымдар өшеді». Сценарий: .cache/c2-native-plan.json → videos → KV1.
     Три тревоги мамы пишутся от руки и перечёркиваются, на их месте — спокойный ответ из фактов; финал: «Мама, уайымдамаңыз» в арке-обереге.
     Все тексты — только в словаре i18n ниже (kk — основной, ?lang=ru — вторая версия). Таймлайн считается из длины текстов (scene.js),
     поэтому правка формулировок не требует правки тайминга.

    <section class="slot" id="s2">

    <section class="slot" id="s3">

      <p class="fact" data-i="f3"></p>
    </section>
  </div>
  </div>

  <!-- ── финал в проёме арки ── -->
  <div class="fin" id="fin">
    <div class="hero">
      <div class="hero-l1"><span class="lt-hand" id="h1" data-i="h1"></span><i class="lt-ico i-heart2 heart" id="heart"></i></div>
      <div class="hero-l2"><span class="lt-hand" id="h2" data-i="h2"></span></div>
    </div>
    <h2 class="head" id="head" data-i="head"></h2>
    <div class="price" id="price"><span data-i="p1"></span><span data-i="p2"></span></div>
  </div>

  <div class="ctabox" id="ctabox">
    <div class="btn" id="btn"><i class="lt-ico i-spark2 spark" id="spark"></i><span data-i="cta"></span><span class="arr">→</span></div>
    <div class="contact" id="contact">
      <div class="logo"><div class="mark">αZ</div><div class="name"><b>α</b>lfa Z</div></div>
      <span class="ct" data-i="contact"></span>
    </div>
  </div>
